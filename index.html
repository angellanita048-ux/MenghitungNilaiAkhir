<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menghitung Nilai Akhir</title>
</head>
<body>
    <h2>Menentukan Nilai</h2>
    
    <div>
        <label for="tugas">hasil tugas</label>
        <input type="number" id="tugas" placeholder="0-100">
    </div>

    <div>
        <label for="UTS">hasil UTS</label>
        <input type="number" id="UTS" placeholder="0-100">
    </div>

    <div>
        <label for="UAS">hasil UAS</label>
        <input type="number" id="UAS" placeholder="0-100">
    </div>

    <button onclick="hitungnilai()">hitung nilai</button>
    <p id="hasil"></p>

    <script src="script.js"></script>
</body>
</html>
